name: Build with Nuitka and Upload to Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing Tag (e.g., v1.0)'
        required: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build   setuptools setuptools-scm -U
          
          pip install -r requirements.txt
          pip install imageio
          python -c "import nep_adapters; assert nep_adapters.backend_status('cpu').available"
          python -m setuptools_scm  --force-write-version-files


      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: NepTrainKit/main.py
          include-package: NepTrainKit
          output-file: NepTrainKit.exe
          mode: standalone
          windows-console-mode: disable
          include-qt-plugins: sqldrivers
          include-package-data: vispy,ase
          upx-binary: ${{ github.workspace }}/src/NepTrainKit/upx${{ runner.os == 'Windows' && '.exe' || '' }}
          enable-plugins: pyside6,upx
          windows-icon-from-ico: NepTrainKit/src/images/logo.png
          working-directory: ${{ github.workspace }}/src/

      - name: Copy additional files
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}/src/build/main.dist"
          if (-not (Test-Path -LiteralPath "$dist/NepTrainKit.exe" -PathType Leaf)) {
            throw "Nuitka standalone executable is missing: $dist/NepTrainKit.exe"
          }
          Copy-Item -Recurse -Path ${{ github.workspace }}/src/NepTrainKit/Config -Destination "$dist/Config" -Force
          Copy-Item -Recurse -Path ${{ github.workspace }}/src/NepTrainKit/translations -Destination "$dist/translations" -Force
          Copy-Item ${{ github.workspace }}/src/NepTrainKit/update.exe "$dist/update.exe"

          if (-not (Test-Path "$dist/translations/neptrainkit_zh_CN.qm")) {
            throw "Chinese translation catalog is missing from the standalone package."
          }
          New-Item -ItemType Directory -Force "$dist/Log"
          New-Item -ItemType File -Path "$dist/Log/.placeholder" -Force

          $adapterVersion = python -c "from importlib.metadata import version; print(version('nep-adapters'))"
          $adapterTarget = "$dist/runtime/nep-adapters/versions/$adapterVersion"
          python -m pip install --no-deps --target "$adapterTarget" "nep-adapters==$adapterVersion"
          $env:PYTHONPATH = "${{ github.workspace }}/src"
          python -m NepTrainKit.runtime_package seed `
            --runtime-root "$dist/runtime" `
            --distribution "nep-adapters" `
            --import-name "nep_adapters" `
            --constraint ">=1.0.1" `
            --health-kind "nep_adapters_cpu" `
            --version "$adapterVersion"

      - name: Verify external NEP runtime
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}/src/build/main.dist"
          $state = Get-Content "$dist/runtime/nep-adapters/state.json" | ConvertFrom-Json
          $adapterTarget = "$dist/runtime/nep-adapters/versions/$($state.active)"
          $arguments = @(
            "--neptrainkit-runtime-health-check",
            $adapterTarget,
            "nep_adapters",
            "nep-adapters",
            $state.active,
            "nep_adapters_cpu"
          )
          $process = Start-Process `
            -FilePath "$dist/NepTrainKit.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "External nep-adapters health check failed with exit code $($process.ExitCode)."
          }

      - name: Upload Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: NepTrainKit-${{ matrix.os }}-${{ inputs.tag_name }}
          path: ${{ github.workspace }}/src/build/main.dist/

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -c "import platform, struct; assert struct.calcsize('P') * 8 == 64; assert platform.machine().lower() in {'amd64', 'x86_64'}; print('Packaging Windows x86_64')"
          Set-Location ${{ github.workspace }}/src/build/main.dist/
          $compress = @{
            Path = "*"
            CompressionLevel = "Fastest"
            DestinationPath = "${{ github.workspace }}/NepTrainKit.windows-x86_64.zip"
          }
          Compress-Archive @compress
          Write-Host "Package created at ${{ github.workspace }}/NepTrainKit.windows-x86_64.zip"

      - name: Verify File Exists
        shell: pwsh
        run: |
          $filePath = "${{ github.workspace }}/NepTrainKit.windows-x86_64.zip"
          if (-not (Test-Path -Path $filePath)) {
            Write-Error "File not found: $filePath"
            exit 1
          }
          Write-Host "File exists: $filePath"
# 获取现有 Release 的 body
      - name: Get Existing Release Body
        id: get_release
        uses: actions/github-script@v6
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.TAG_NAME
              });
              core.setOutput('body', release.body || 'No release notes available.');
              core.setOutput('id', release.id);
              console.log(`Fetched release body for tag ${process.env.TAG_NAME}`);
            } catch (error) {
              core.setOutput('id', null);
            
              core.setFailed(`Error: No release found for tag ${process.env.TAG_NAME}. Please create it first.`);
            }
      # 使用现有 body 创建/更新 Release
      - name: Upload Release
        if: steps.get_release.outputs.id
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          body: ${{ steps.get_release.outputs.body }}  # 使用获取到的现有 body
          files: ${{ github.workspace }}/NepTrainKit.windows-x86_64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
