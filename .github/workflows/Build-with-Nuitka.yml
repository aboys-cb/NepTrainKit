name: Build Windows Standalone with Nuitka

# Dispatch this workflow on the default branch; ref_name selects the source.
# GitHub caches created on one release tag cannot be restored by another tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref_name:
        description: 'Branch, tag, or commit to build'
        required: true
        default: 'dev'
      publish_release:
        description: 'Upload the archive to an existing release after verification'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Existing release to rebuild from ref_name (blank requires ref_name to be the release tag)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  dispatch_release:
    # Release runs are scoped to tags. Dispatch on the default branch so all
    # releases can restore AND update the same compiler cache scope.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch release build with shared cache
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh workflow run Build-with-Nuitka.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f "ref_name=refs/tags/$RELEASE_TAG" \
            -F publish_release=true \
            -f "release_tag=$RELEASE_TAG"
          echo "Windows build dispatched on $DEFAULT_BRANCH for release $RELEASE_TAG. Follow the workflow_dispatch run in Actions for the build and upload result." >> "$GITHUB_STEP_SUMMARY"

  build:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: windows-standalone-${{ inputs.publish_release && (inputs.release_tag || inputs.ref_name) || github.run_id }}
      cancel-in-progress: false
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # Exact Nuitka revision used by the successful v3.1.5 build (4.3.1).
      NUITKA_VERSION: 8ba9ccdf78268aba8bb21b79ed72fc9a4d44887d

    steps:
      - name: Require shared cache scope
        shell: pwsh
        env:
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:WORKFLOW_REF -ne "refs/heads/$env:DEFAULT_BRANCH") {
            throw "Run this workflow from $env:DEFAULT_BRANCH to share compiler caches. Select the source branch, tag or commit using ref_name."
          }
          "NUITKA_CACHE_DIR=$env:RUNNER_TEMP/nuitka-cache" >> $env:GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref_name }}
      - name: Verify release source tag
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.ref_name }}
          REBUILD_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = if ($env:REBUILD_TAG) { $env:REBUILD_TAG } else { $env:SOURCE_REF }
          $tagRef = "refs/tags/$releaseTag"
          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -ne 0) {
            throw "Release publishing requires an existing tag: $tagRef"
          }
          gh release view $releaseTag --repo "$env:GITHUB_REPOSITORY" --json tagName
          if ($LASTEXITCODE -ne 0) {
            throw "Release $releaseTag does not exist."
          }
          $headCommit = git rev-parse HEAD
          $tagCommit = git rev-list -n 1 $tagRef
          if ($env:REBUILD_TAG) {
            git merge-base --is-ancestor $tagCommit $headCommit
            if ($LASTEXITCODE -ne 0) {
              throw "Rebuild source $headCommit must descend from $releaseTag ($tagCommit)."
            }
            if ($releaseTag -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+(?:b[0-9]+)?)$') {
              throw "Cannot derive a package version from release tag $releaseTag."
            }
            "SETUPTOOLS_SCM_PRETEND_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          } elseif ($headCommit -ne $tagCommit) {
            throw "Checked-out commit $headCommit does not match release tag $tagRef ($tagCommit)."
          }
          Write-Host "Release $releaseTag will be built from source commit $headCommit."
      - name: Setup Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
          cache: 'pip'

      - name: Restore Nuitka compiler cache
        id: nuitka-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          # A fresh key lets repeated builds enrich the immutable cache.
          # Restore across source/dependency changes: clcache validates each
          # object against its source, compiler and compiler options.
          key: nuitka-windows-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ env.NUITKA_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nuitka-windows-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ env.NUITKA_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools setuptools-scm pybind11 -U
          
          pip install -r requirements.txt
          pip install imageio
          python -c "import nep_adapters; assert nep_adapters.backend_status('cpu').available"
          python -m setuptools_scm  --force-write-version-files

      - name: Record build environment
        shell: pwsh
        run: |
          $diagnostics = "${{ runner.temp }}/nuitka-diagnostics"
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          git rev-parse HEAD | Set-Content "$diagnostics/source-commit.txt"
          python --version | Set-Content "$diagnostics/python-version.txt"
          python -m pip freeze | Set-Content "$diagnostics/requirements-resolved.txt"
          "Nuitka revision: $env:NUITKA_VERSION" | Set-Content "$diagnostics/compiler.txt"
          "Cache directory: $env:NUITKA_CACHE_DIR" >> $env:GITHUB_STEP_SUMMARY
          "Compiler object hit/miss counts are reported by Nuitka-Scons in the build log; cache archive restoration alone does not prove object reuse." >> $env:GITHUB_STEP_SUMMARY

      - name: Build and verify native helpers
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python setup.py build_ext --inplace
          if ($LASTEXITCODE -ne 0) {
            throw "Building NepTrainKit native helpers failed with exit code $LASTEXITCODE."
          }
          python -c "import NepTrainKit._native._io, NepTrainKit._native._dump, NepTrainKit._native._audit, NepTrainKit._native._phase, NepTrainKit._native._magnetism, NepTrainKit._native._sampling"
          if ($LASTEXITCODE -ne 0) {
            throw "Importing NepTrainKit native helpers failed with exit code $LASTEXITCODE."
          }
          python -c "from NepTrainKit.main import create_app; from qfluentwidgets import fontFamilies; app = create_app([]); assert fontFamilies() == app.font().families(); print('GUI imports and font configuration passed')"
          if ($LASTEXITCODE -ne 0) {
            throw "Importing and configuring the application failed with exit code $LASTEXITCODE."
          }
          python -c "from NepTrainKit.core.dataset.catalog import load_dataset_catalog; load_dataset_catalog()"
          if ($LASTEXITCODE -ne 0) {
            throw "Required dataset catalog is invalid or missing before compilation."
          }
          $qtOpenGl = python tools/ci/find_qt_software_opengl.py
          if ($LASTEXITCODE -ne 0) { throw "Could not locate Qt software OpenGL DLL." }
          python -c "import ctypes, sys; ctypes.WinDLL(sys.argv[1])" "$qtOpenGl"
          if ($LASTEXITCODE -ne 0) { throw "Qt software OpenGL DLL could not be loaded before compilation." }
          "QT_SOFTWARE_OPENGL_DLL=$qtOpenGl" >> $env:GITHUB_ENV
          Write-Host "Qt software OpenGL DLL: $qtOpenGl"


      - name: Build with Nuitka
        id: nuitka
        uses: Nuitka/Nuitka-Action@bb65ca8023bef5f41a2114acd387b5f36d860145
        with:
          nuitka-version: ${{ env.NUITKA_VERSION }}
          # Disable only the Action's cache wrapper. Nuitka's clcache/UPX
          # caches remain enabled through NUITKA_CACHE_DIR above.
          disable-cache: true
          report: ${{ runner.temp }}/nuitka-diagnostics/compilation-report.xml
          script-name: NepTrainKit/main.py
          include-package: NepTrainKit
          include-module: NepTrainKit._native._io,NepTrainKit._native._dump,NepTrainKit._native._audit,NepTrainKit._native._phase,NepTrainKit._native._magnetism,NepTrainKit._native._sampling
          output-file: NepTrainKit.exe
          mode: standalone
          windows-console-mode: disable
          include-qt-plugins: sqldrivers
          include-package-data: vispy,ase
          include-data-dir: NepTrainKit/core/dataset/catalogs=NepTrainKit/core/dataset/catalogs
          upx-binary: ${{ github.workspace }}/src/NepTrainKit/upx${{ runner.os == 'Windows' && '.exe' || '' }}
          enable-plugins: pyside6,upx
          windows-icon-from-ico: NepTrainKit/src/images/logo.png
          working-directory: ${{ github.workspace }}/src/

      - name: Save compiler cache before package verification
        if: ${{ !cancelled() && steps.nuitka.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: ${{ steps.nuitka-cache.outputs.cache-primary-key }}

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Nuitka-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nuitka-diagnostics/
          if-no-files-found: warn

      - name: Copy additional files
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}/src/build/main.dist"
          if (-not (Test-Path -LiteralPath "$dist/NepTrainKit.exe" -PathType Leaf)) {
            throw "Nuitka standalone executable is missing: $dist/NepTrainKit.exe"
          }
          Copy-Item -Recurse -Path ${{ github.workspace }}/src/NepTrainKit/Config -Destination "$dist/Config" -Force
          Copy-Item -Recurse -Path ${{ github.workspace }}/src/NepTrainKit/translations -Destination "$dist/translations" -Force
          Copy-Item -Recurse -Path ${{ github.workspace }}/src/NepTrainKit/workflow_templates -Destination "$dist/workflow_templates" -Force
          Copy-Item ${{ github.workspace }}/src/NepTrainKit/update.exe "$dist/update.exe"

          # importlib.resources resolves this path inside the compiled package.
          $catalogSource = "${{ github.workspace }}/src/NepTrainKit/core/dataset/catalogs"
          $catalogDestination = "$dist/NepTrainKit/core/dataset/catalogs"
          foreach ($catalog in Get-ChildItem -LiteralPath $catalogSource -Filter "*.json" -File) {
            $packagedCatalog = Join-Path $catalogDestination $catalog.Name
            if (-not (Test-Path -LiteralPath $packagedCatalog -PathType Leaf)) {
              throw "Dataset catalog missing from standalone package: $packagedCatalog"
            }
            if ((Get-FileHash $catalog.FullName).Hash -ne (Get-FileHash $packagedCatalog).Hash) {
              throw "Packaged dataset catalog differs from source: $packagedCatalog"
            }
          }

          # Nuitka's Qt plugin only adds this fallback with QML/all enabled.
          # Widgets/VisPy also need it on Windows runners without a GPU driver.
          # Reuse the exact DLL already located and loaded before compilation.
          Copy-Item -LiteralPath $env:QT_SOFTWARE_OPENGL_DLL -Destination "$dist/opengl32sw.dll" -ErrorAction Stop
          python -c "import ctypes, sys; ctypes.WinDLL(sys.argv[1])" "$dist/opengl32sw.dll"
          if ($LASTEXITCODE -ne 0) { throw "Packaged software OpenGL DLL could not be loaded." }

          if (-not (Test-Path "$dist/translations/neptrainkit_zh_CN.qm")) {
            throw "Chinese translation catalog is missing from the standalone package."
          }
          $templateSource = "${{ github.workspace }}/src/NepTrainKit/workflow_templates"
          $templateDestination = "$dist/workflow_templates"
          $sourceTemplates = @(
            Get-ChildItem -LiteralPath $templateSource -Filter "*.json" -File |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          $packagedTemplates = @(
            Get-ChildItem -LiteralPath $templateDestination -Filter "*.json" -File |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          if ($sourceTemplates.Count -eq 0) {
            throw "No built-in workflow template JSON files were found in the source package."
          }
          $templateDiff = Compare-Object `
            -ReferenceObject $sourceTemplates `
            -DifferenceObject $packagedTemplates
          if ($templateDiff) {
            $templateDiffText = ($templateDiff | Out-String).Trim()
            throw "Built-in workflow templates differ between source and standalone package:`n$templateDiffText"
          }
          New-Item -ItemType Directory -Force "$dist/Log"
          New-Item -ItemType File -Path "$dist/Log/.placeholder" -Force

          $adapterVersion = python -c "from importlib.metadata import version; print(version('nep-adapters'))"
          $adapterTarget = "$dist/runtime/nep-adapters/versions/$adapterVersion"
          python -m pip install --no-deps --target "$adapterTarget" "nep-adapters==$adapterVersion"
          $env:PYTHONPATH = "${{ github.workspace }}/src"
          python -m NepTrainKit.runtime_package seed `
            --runtime-root "$dist/runtime" `
            --distribution "nep-adapters" `
            --import-name "nep_adapters" `
            --constraint ">=1.0.3" `
            --health-kind "nep_adapters_cpu" `
            --version "$adapterVersion"

      - name: Verify external NEP runtime
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}/src/build/main.dist"
          $state = Get-Content "$dist/runtime/nep-adapters/state.json" | ConvertFrom-Json
          $adapterTarget = "$dist/runtime/nep-adapters/versions/$($state.active)"
          $arguments = @(
            "--neptrainkit-runtime-health-check",
            $adapterTarget,
            "nep_adapters",
            "nep-adapters",
            $state.active,
            "nep_adapters_cpu"
          )
          $process = Start-Process `
            -FilePath "$dist/NepTrainKit.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "External nep-adapters health check failed with exit code $($process.ExitCode)."
          }

      - name: Verify packaged native helpers
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}/src/build/main.dist/NepTrainKit.exe"
          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList "--neptrainkit-native-health-check" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged native helper health check failed with exit code $($process.ExitCode)."
          }

      - name: Verify packaged GUI startup
        shell: pwsh
        env:
          QT_OPENGL: software
        run: |
          $dist = "${{ github.workspace }}/src/build/main.dist"
          $stdout = "$env:RUNNER_TEMP/neptrainkit-startup.stdout.log"
          $stderr = "$env:RUNNER_TEMP/neptrainkit-startup.stderr.log"
          $process = Start-Process -FilePath "$dist/NepTrainKit.exe" `
            -WorkingDirectory $dist -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged GUI exited during startup with code $($process.ExitCode)."
              }
            } while ($process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($process.MainWindowHandle -eq 0) {
              throw "Packaged GUI did not create a window within 60 seconds."
            }
            Write-Host "Packaged GUI opened: $($process.MainWindowTitle)"
            if (-not $process.CloseMainWindow() -or -not $process.WaitForExit(15000)) {
              throw "Packaged GUI did not close cleanly."
            }
            if ($process.ExitCode -ne 0) {
              throw "Packaged GUI exited with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
          }

      - name: Upload startup diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Windows-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/neptrainkit-startup.*.log
            src/build/main.dist/Log/
          if-no-files-found: ignore

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -c "import platform, struct; assert struct.calcsize('P') * 8 == 64; assert platform.machine().lower() in {'amd64', 'x86_64'}; print('Packaging Windows x86_64')"
          Set-Location ${{ github.workspace }}/src/build/main.dist/
          $compress = @{
            Path = "*"
            CompressionLevel = "Fastest"
            DestinationPath = "${{ github.workspace }}/NepTrainKit.windows-x86_64.zip"
          }
          Compress-Archive @compress
          Write-Host "Package created at ${{ github.workspace }}/NepTrainKit.windows-x86_64.zip"

      - name: Verify File Exists
        shell: pwsh
        run: |
          $filePath = "${{ github.workspace }}/NepTrainKit.windows-x86_64.zip"
          if (-not (Test-Path -Path $filePath)) {
            Write-Error "File not found: $filePath"
            exit 1
          }
          Write-Host "File exists: $filePath"

      - name: Upload packaged archive
        uses: actions/upload-artifact@v4
        with:
          name: NepTrainKit-windows-x86_64-${{ github.run_number }}
          path: ${{ github.workspace }}/NepTrainKit.windows-x86_64.zip
          if-no-files-found: error

      - name: Upload Release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || inputs.ref_name }}
        run: gh release upload "$env:RELEASE_TAG" "${{ github.workspace }}/NepTrainKit.windows-x86_64.zip" --repo "$env:GITHUB_REPOSITORY" --clobber
